<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef2f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#070d18" media="(prefers-color-scheme: dark)">
<title>School Planner Offline</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
/* ---------- Farbwelt ----------
   Dunkel ist die Grundlage; hell wird ueber [data-theme="light"] gesetzt.
   Welche Variante gilt, entscheidet JavaScript (System / Hell / Dunkel), damit
   es nur EINE Definition je Palette gibt. */
:root{
  color-scheme:dark;
  --bg:#0f1622; --bg-2:#0b111b; --card:#182231; --card-2:#1d2838; --line:#2c3a4e;
  --ink:#e9eff8; --muted:#94a5bd; --soft:rgba(148,165,189,.09);
  --accent:#4cb6ef; --accent-ink:#04121f; --accent-soft:rgba(76,182,239,.13);
  --ok:#3ddc9a; --ok-soft:rgba(61,220,154,.14);
  --warn:#e2b33d; --warn-soft:rgba(226,179,61,.10); --warn-ink:#f2d68a; --warn-line:#6b5620;
  --bad:#f0736c; --bad-soft:rgba(240,115,108,.14);
  --stage-bg:#14263a; --stage-line:#2f6b96;
  --note-bg:#221d10;
  --pre-bg:#0c131d; --pre-ink:#cfe8ff;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  --ctl:30px; --fs:13.5px; --pad:13px; --gap:9px; --r:8px;
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#eef1f6; --bg-2:#e6eaf2; --card:#ffffff; --card-2:#f8fafd; --line:#d4dce8;
  --ink:#16202f; --muted:#5a6a83; --soft:rgba(22,32,47,.05);
  --accent:#1668a8; --accent-ink:#ffffff; --accent-soft:rgba(22,104,168,.09);
  --ok:#0d7a55; --ok-soft:rgba(13,122,85,.11);
  --warn:#96661a; --warn-soft:#fbf3e2; --warn-ink:#6b4a08; --warn-line:#d9bd85;
  --bad:#bf3b33; --bad-soft:rgba(191,59,51,.10);
  --stage-bg:#f1f7fd; --stage-line:#a9cdec;
  --note-bg:#fdf8ed;
  --pre-bg:#f1f4f9; --pre-ink:#14344e;
  --shadow:0 1px 2px rgba(22,32,47,.07);
}
@media (pointer: coarse){ :root{ --ctl:40px; --fs:14.5px; --pad:15px; --gap:11px; } }

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink); font-size:var(--fs);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased; overscroll-behavior-y:none;
}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
h1,h2,h3{margin:0;line-height:1.25}
p{margin:0}

/* ---------- Rahmen ---------- */
.app{max-width:1180px;margin:0 auto;padding:0 18px 24px}
@media (max-width:759px){ .app{padding-bottom:calc(70px + env(safe-area-inset-bottom))} }

/* Die Kopfzeile ist unter macOS zugleich die Greiffläche zum Verschieben. */
.topbar{
  position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;
  padding:9px 0;background:var(--bg);border-bottom:1px solid var(--line);margin-bottom:14px;
  -webkit-app-region:drag;
}
.topbar button,.topbar input,.topbar select,.topbar .nav{-webkit-app-region:no-drag}
/* macOS-App: fester 38-px-Streifen fuer die Fensterknoepfe, zugleich Greifflaeche.
   Feste Hoehe statt Innenabstand – so kann der Inhalt nie darunter rutschen. */
.titlebar{display:none}
body.is-mac-app .titlebar{
  display:block;position:fixed;top:0;left:0;right:0;height:38px;z-index:60;
  background:var(--bg);border-bottom:1px solid var(--line);-webkit-app-region:drag;
}
body.is-mac-app .app{padding-top:38px}
body.is-mac-app .topbar{top:38px}
body.is-mac-app .month__label{top:calc(38px + 56px)}
body.is-mac-app .course-side{top:calc(38px + 64px)}

/* Hinweis auf eine neuere Fassung */
.update{border:1px solid var(--accent);background:var(--accent-soft);border-radius:var(--r);
        padding:var(--pad);margin-bottom:14px}
.update h3{font-size:.92rem;font-weight:700}
.update ol{margin:9px 0 0;padding-left:19px;font-size:.81rem;color:var(--muted);line-height:1.65}
.update ol b{color:var(--ink);font-weight:600}
.topbar__title{font-size:.98rem;font-weight:700;letter-spacing:-.01em}
.topbar__sub{font-size:.75rem;color:var(--muted);margin-top:1px}
.topbar__spacer{flex:1}
.back,.icon-btn{
  display:inline-flex;align-items:center;justify-content:center;
  width:var(--ctl);height:var(--ctl);border-radius:var(--r);
  background:var(--card);border:1px solid var(--line);flex:0 0 auto;color:var(--muted);
}
.icon-btn:hover,.back:hover{color:var(--ink);border-color:var(--muted)}
.icon-btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- Reiter ---------- */
.nav{display:flex;gap:3px;padding:3px;border-radius:var(--r);background:var(--soft);border:1px solid var(--line)}
.nav button{
  display:inline-flex;align-items:center;gap:6px;height:calc(var(--ctl) - 6px);padding:0 11px;
  border-radius:calc(var(--r) - 2px);font-size:.79rem;font-weight:600;color:var(--muted);position:relative;
}
.nav button:hover{color:var(--ink)}
.nav button[aria-current="true"]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.nav svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nav .count{margin-left:2px;background:var(--warn);color:var(--bg);border-radius:999px;font-size:.65rem;padding:0 5px;font-weight:800}
@media (max-width:759px){
  .nav{position:fixed;left:0;right:0;bottom:0;z-index:30;border-radius:0;border:none;
       border-top:1px solid var(--line);background:var(--card);gap:0;
       padding:5px 8px calc(5px + env(safe-area-inset-bottom))}
  .nav button{flex:1;flex-direction:column;gap:2px;height:auto;padding:6px 0;font-size:.67rem}
  .nav .count{position:absolute;top:1px;left:50%;margin-left:6px}
}

/* ---------- Bausteine ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:var(--pad);box-shadow:var(--shadow)}
.card + .card{margin-top:var(--gap)}
.section-title{font-size:.69rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
.muted{color:var(--muted)}
.small{font-size:.81rem}
.row{display:flex;align-items:center;gap:8px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.stack{display:flex;flex-direction:column;gap:var(--gap)}
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  height:var(--ctl);padding:0 14px;border-radius:var(--r);
  background:var(--card);border:1px solid var(--line);font-size:.83rem;font-weight:600;
  box-shadow:var(--shadow);white-space:nowrap;
}
.btn:hover{border-color:var(--muted)}
.btn--primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn--primary:hover{filter:brightness(1.08)}
.btn--ghost{background:transparent;box-shadow:none;color:var(--muted)}
.btn--ghost:hover{color:var(--ink)}
.btn--danger{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.controls{display:flex;align-items:center;gap:8px;margin-top:14px;flex-wrap:wrap}
.controls .spacer{flex:1}

.field{height:var(--ctl);border-radius:var(--r);border:1px solid var(--line);background:var(--card);padding:0 10px;font-size:.82rem;min-width:200px}
.field:focus{outline:none;border-color:var(--accent)}

.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:5px;font-size:.69rem;font-weight:700;white-space:nowrap}
.badge--planned{background:var(--soft);color:var(--muted)}
.badge--running{background:var(--accent-soft);color:var(--accent)}
.badge--done{background:var(--ok-soft);color:var(--ok)}
.badge--dirty{background:var(--warn-soft);color:var(--warn)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex:0 0 auto}

/* ---------- Stundenkarten (Heute) ---------- */
.lesson{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);
        border-radius:var(--r);padding:10px 12px;box-shadow:var(--shadow)}
.lesson:hover{border-color:var(--muted)}
.lesson--running{border-color:var(--accent)}
.lesson__top{display:flex;align-items:center;gap:10px}
.slot{display:inline-flex;align-items:center;justify-content:center;flex-direction:column;
      min-width:32px;height:32px;border-radius:6px;background:var(--accent-soft);color:var(--accent);
      font-weight:700;font-size:.88rem;flex:0 0 auto;line-height:1}
.slot small{font-size:.53rem;opacity:.75;font-weight:600;margin-top:1px}
.lesson__course{font-size:.71rem;font-weight:700;color:var(--accent)}
.lesson__title{font-size:.9rem;font-weight:600;margin-top:1px}
.lesson__meta{display:flex;flex-wrap:wrap;gap:7px;margin-top:6px;font-size:.75rem;color:var(--muted)}
.bar{height:4px;border-radius:999px;background:var(--soft);overflow:hidden;margin-top:7px}
.bar > i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .25s ease}

/* ---------- Kursansicht: Liste links, Stunden rechts ---------- */
.course-layout{display:grid;grid-template-columns:210px 1fr;gap:16px;align-items:start}
@media(max-width:820px){.course-layout{grid-template-columns:1fr}}
.course-side{display:flex;flex-direction:column;gap:4px;position:sticky;top:64px}
.course-item{text-align:left;padding:8px 10px;border-radius:var(--r);border:1px solid transparent;color:var(--muted)}
.course-item:hover{background:var(--soft);color:var(--ink)}
.course-item[aria-current="true"]{background:var(--card);border-color:var(--line);color:var(--ink);box-shadow:var(--shadow)}
.course-item b{display:block;font-size:.85rem;font-weight:600}
.course-item small{display:block;font-size:.71rem;color:var(--muted);margin-top:1px}

.month{margin-bottom:16px}
.month__label{font-size:.69rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);
              padding:0 2px 6px;position:sticky;top:56px;background:var(--bg);z-index:5}
.ltable{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);
        border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.ltable tr{border-bottom:1px solid var(--line);cursor:pointer}
.ltable tr:last-child{border-bottom:none}
.ltable tr:hover{background:var(--soft)}
.ltable tr.is-today{background:var(--accent-soft)}
.ltable td{padding:7px 10px;font-size:.83rem;vertical-align:middle}
.ltable .c-date{width:96px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.ltable .c-slot{width:34px;color:var(--muted);text-align:center}
.ltable .c-title{font-weight:600}
.ltable .c-state{width:88px;text-align:right}
.ltable .c-prog{width:64px}

/* ---------- Live-Cockpit ---------- */
.cockpit{display:grid;grid-template-columns:1.35fr .65fr;gap:var(--gap);align-items:start}
@media(max-width:900px){.cockpit{grid-template-columns:1fr}}
.panel{border:1px solid var(--line);border-radius:var(--r);padding:var(--pad);background:var(--card);box-shadow:var(--shadow)}
.panel--stage{border-color:var(--stage-line);background:var(--stage-bg)}
.panel--notes{border-color:var(--warn-line);background:var(--note-bg)}
.panel__label{font-size:.66rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
              display:flex;align-items:center;gap:6px;margin-bottom:8px}
.panel--stage .panel__label{color:var(--accent)}
.panel--notes .panel__label{color:var(--warn)}
.stage__title{font-size:1.02rem;font-weight:700;line-height:1.3}
.teacher-note{line-height:1.55;font-size:.84rem;color:var(--warn-ink)}
.fmt{margin:.55em 0;line-height:1.55;color:var(--muted);font-size:.84rem}
.fmt:first-child{margin-top:.35em}
pre{margin:.6em 0;padding:9px 11px;border-radius:6px;background:var(--pre-bg);border:1px solid var(--line);
    overflow-x:auto;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.79rem;line-height:1.5;color:var(--pre-ink)}
code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--accent-soft);color:var(--accent);
     padding:1px 4px;border-radius:4px;font-size:.9em}
.next{margin-top:10px;padding-top:9px;border-top:1px solid var(--warn-line);font-size:.79rem;color:var(--muted)}
.next b{display:block;font-size:.64rem;letter-spacing:.08em;text-transform:uppercase;opacity:.8;margin-bottom:2px}
.next .teacher-note{margin-top:4px;font-size:.79rem;opacity:.92}

/* ---------- Ablaufliste ---------- */
.step{display:flex;gap:10px;padding:8px 11px;border-radius:var(--r);border:1px solid var(--line);background:var(--card)}
.step + .step{margin-top:5px}
.step--current{border-color:var(--accent);background:var(--accent-soft)}
.step--done{opacity:.55}
.step__num{width:21px;height:21px;border-radius:5px;background:var(--soft);display:flex;align-items:center;
           justify-content:center;font-weight:700;font-size:.72rem;flex:0 0 auto;margin-top:1px}
.step--current .step__num{background:var(--accent);color:var(--accent-ink)}
.step--done .step__num{background:var(--ok-soft);color:var(--ok)}
.step__body{flex:1;min-width:0}
.step__title{font-weight:600;font-size:.85rem}
.note{margin-top:6px;padding:6px 9px;border-radius:5px;background:var(--warn-soft);border:1px solid var(--warn-line);
      font-size:.78rem;color:var(--warn-ink);line-height:1.45}
.note b{display:block;font-size:.62rem;letter-spacing:.07em;text-transform:uppercase;opacity:.85;margin-bottom:2px;color:var(--warn)}

/* ---------- Mitarbeit ---------- */
.students{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--card);box-shadow:var(--shadow)}
.student{display:grid;grid-template-columns:minmax(140px,1.1fr) auto auto minmax(90px,.9fr);gap:10px;
         align-items:center;padding:5px 11px;border-bottom:1px solid var(--line)}
.student:last-child{border-bottom:none}
.student:hover{background:var(--soft)}
@media(max-width:820px){ .student{grid-template-columns:1fr;gap:7px;padding:10px} }
.student__name{font-weight:600;font-size:.84rem;display:flex;align-items:center;gap:7px;min-width:0}
.student__name span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg{display:flex;gap:3px;padding:2px;border-radius:6px;background:var(--soft);border:1px solid var(--line)}
.seg button{height:calc(var(--ctl) - 10px);min-width:29px;padding:0 8px;border-radius:4px;
            font-weight:600;font-size:.76rem;color:var(--muted);white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg--status button[aria-pressed="true"].is-excused{background:var(--warn);color:#fff}
.seg--status button[aria-pressed="true"].is-unexcused{background:var(--bad);color:#fff}
.grade-select{height:calc(var(--ctl) - 6px);border-radius:6px;border:1px solid var(--line);background:var(--card);
              padding:0 7px;font-size:.79rem;font-weight:600}
.no-scale{font-size:.75rem;color:var(--muted);font-style:italic}
.student__note{height:calc(var(--ctl) - 6px);border-radius:6px;border:1px dashed var(--line);background:transparent;
               color:var(--muted);text-align:left;padding:0 9px;font-size:.78rem;overflow:hidden;
               text-overflow:ellipsis;white-space:nowrap}
.student__note.has{border-style:solid;color:var(--ink);background:var(--soft)}
.student__note:hover{border-color:var(--muted)}

/* ---------- Abgleich ---------- */
.kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--line);font-size:.83rem}
.kv:last-child{border-bottom:none}
.change{display:flex;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid var(--line);font-size:.81rem}
.change:last-child{border-bottom:none}
.conflict{border:1px solid var(--warn-line);background:var(--warn-soft);border-radius:var(--r);padding:var(--pad)}
.conflict + .conflict{margin-top:var(--gap)}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}
.choice button{border-radius:6px;border:1px solid var(--line);background:var(--card);padding:8px 10px;text-align:left;line-height:1.35}
.choice button:hover{border-color:var(--accent)}
.choice button small{display:block;font-size:.65rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.choice button strong{font-size:.84rem}

/* ---------- Vollbild ---------- */
.overlay{position:fixed;inset:0;z-index:70;background:var(--bg);display:flex;flex-direction:column;
         padding:clamp(20px,4vw,52px) clamp(20px,5vw,72px) 0}
.overlay__meta{font-size:clamp(.76rem,1.3vw,.98rem);font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.overlay__title{font-size:clamp(1.6rem,4.2vw,3.2rem);font-weight:750;line-height:1.15;margin-top:.3em}
.overlay__body{flex:1;overflow-y:auto;margin-top:clamp(12px,2vw,24px);font-size:clamp(.95rem,1.7vw,1.4rem)}
.overlay__body .fmt{color:var(--ink);font-size:inherit;line-height:1.6}
.overlay__body pre{font-size:clamp(.8rem,1.3vw,1.05rem)}
.presbar{display:flex;align-items:center;gap:10px;padding:12px 0 14px;border-top:1px solid var(--line);margin-top:10px}
.presbar .grow{flex:1}

/* ---------- Sheet & Toast ---------- */
.sheet-bg{position:fixed;inset:0;background:rgba(6,12,20,.5);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.sheet{width:100%;max-width:440px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);
       padding:var(--pad);box-shadow:0 18px 44px rgba(0,0,0,.3)}
.sheet textarea{width:100%;min-height:92px;border-radius:6px;border:1px solid var(--line);background:var(--bg);
                padding:9px;resize:vertical;margin-top:10px;font-size:.84rem}
.empty{text-align:center;padding:34px 20px;color:var(--muted);font-size:.84rem}
.empty svg{width:32px;height:32px;stroke:currentColor;fill:none;stroke-width:1.5;opacity:.45;margin-bottom:10px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:60;background:var(--card);
       border:1px solid var(--line);border-radius:var(--r);padding:8px 15px;font-weight:600;font-size:.81rem;
       box-shadow:0 12px 30px rgba(0,0,0,.22);max-width:90vw;text-align:center}
</style>
</head>
<body>
<div id="app"></div>

<script>
"use strict";

/* =========================================================================
   School Planner Offline
   Zero-Build: nur diese Datei. Daten liegen im localStorage.

   Zwei Betriebsarten:
   - "demo": ohne Zugangsdaten; ein simulierter Server erlaubt es, den
     kompletten Ablauf inklusive Konflikten durchzuspielen.
   - "live": gegen eine echte Nextcloud ab School Planner 1.3.0. Die Anfragen
     laufen im Electron-Hauptprozess (kein CORS), das App-Passwort bleibt dort.

   Feldnamen folgen bewusst der Schnittstelle: lessonDate, lessonSlot,
   published, isCurrent. Einen Stundenstatus gibt es serverseitig nicht – er
   wird aus den Elementen abgeleitet.
   ========================================================================= */

var KEY = "spo.proto.v2";
var API_VERSION = 1;

var GRADES = {
  "": [],
  "scale3": ["+", "+/-", "-"],
  "scale5": ["++", "+", "+/-", "-", "--"],
  "note":   ["1", "2", "3", "4", "5", "6"]
};
var SCALE_LABEL = { "":"Keine Note", "scale3":"Skala 1–3", "scale5":"Skala 1–5", "note":"Note 1–6" };
var STATUS = [
  { id:"present",   label:"Anwesend",       short:"Da",        cls:"" },
  { id:"excused",   label:"Entschuldigt",   short:"Entsch.",   cls:"is-excused" },
  { id:"unexcused", label:"Unentschuldigt", short:"Unentsch.", cls:"is-unexcused" }
];
function gradesFor(scale){ return GRADES[scale] || []; }

/* ---------- Helfer ---------- */
function now(){ return new Date().toISOString(); }
function iso(d){ return d.toISOString().slice(0,10); }
function addDays(d,n){ var x=new Date(d.getTime()); x.setDate(x.getDate()+n); return x; }
function deLong(s){ return new Date(s+"T12:00:00").toLocaleDateString("de-DE",{weekday:"long",day:"2-digit",month:"long"}); }
function deShort(s){ return new Date(s+"T12:00:00").toLocaleDateString("de-DE",{weekday:"short",day:"2-digit",month:"2-digit"}); }
function monthLabel(s){ return new Date(s+"T12:00:00").toLocaleDateString("de-DE",{month:"long",year:"numeric"}); }
function relTime(t){
  if(!t) return "noch nie";
  var diff=(Date.now()-new Date(t).getTime())/1000;
  if(diff<60) return "gerade eben";
  if(diff<3600) return "vor "+Math.floor(diff/60)+" Min.";
  if(diff<86400) return "vor "+Math.floor(diff/3600)+" Std.";
  return "am "+new Date(t).toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
}
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function pkey(lessonId, studentId){ return lessonId+":"+studentId; }
function newer(a,b){
  if(!a || !b) return true;
  var ta=Date.parse(a), tb=Date.parse(b);
  if(isNaN(ta) || isNaN(tb)) return true;
  return ta > tb;
}

/* Sehr kleiner Markdown-Renderer: Codebloecke, fett, Inline-Code, Absaetze. */
function fmt(text){
  if(!text) return "";
  var parts = String(text).split("```"), out = "";
  for(var i=0;i<parts.length;i++){
    if(i%2===1){
      out += '<pre>'+esc(parts[i].replace(/^[a-zA-Z0-9]*\n/,"").replace(/\n$/,""))+'</pre>';
    } else {
      var chunk = parts[i].replace(/^\n+|\n+$/g,"");
      if(!chunk) continue;
      out += esc(chunk)
        .replace(/\*\*(.+?)\*\*/g,"<b>$1</b>")
        .replace(/`([^`]+)`/g,"<code>$1</code>")
        .split(/\n{2,}/)
        .map(function(p){ return '<p class="fmt">'+p.replace(/\n/g,"<br>")+'</p>'; })
        .join("");
    }
  }
  return out;
}

/* Der Stundenstatus ist KEIN gespeichertes Feld – die Nextcloud kennt ihn
   nicht. Er ergibt sich aus den Elementen, damit beide Seiten dasselbe
   sehen, ohne dass etwas synchronisiert werden muss. */
function lessonStatus(l){
  var its = itemsOf(l.id);
  if(!its.length) return "planned";
  var current = its.filter(function(i){ return i.isCurrent; }).length;
  var published = its.filter(function(i){ return i.published; }).length;
  if(current > 0) return "running";
  if(published >= its.length) return "done";
  if(published > 0) return "running";
  return "planned";
}
function currentItem(lessonId){
  var its = itemsOf(lessonId);
  return its.filter(function(i){ return i.isCurrent; })[0] || null;
}

function touchItem(i){ i.updatedAt = now(); i.dirty = true; save(); }
function setPart(lessonId, studentId, patch){
  var k = pkey(lessonId, studentId);
  var cur = state.local.participation[k]
    || { lessonId:lessonId, studentId:studentId, status:"", grade:"", note:"", syncedAt:null };
  for(var p in patch){ cur[p]=patch[p]; }
  cur.updatedAt = now();
  cur.dirty = true;
  state.local.participation[k] = cur;
  save();
}

/* ---------- Offene Aenderungen ----------
   Bewusst ein Flag und kein Zeitstempelvergleich: Geht die Uhr des Servers
   vor, wuerden lokale Aenderungen sonst als "aelter" gelten und still nie
   uebertragen. Zeitstempel dienen ausschliesslich der Konflikterkennung. */
function isDirty(rec){ return !!(rec && rec.dirty); }
function dirtyItems(){ return state.local.items.filter(isDirty); }
function dirtyParticipation(){
  return Object.keys(state.local.participation)
    .map(function(k){ return state.local.participation[k]; })
    .filter(isDirty);
}
function pendingChanges(){
  var out=[];
  dirtyItems().forEach(function(i){ out.push({type:"item", label:"Ablauf – "+i.title}); });
  dirtyParticipation().forEach(function(p){
    var st = state.meta.students.filter(function(s){ return s.id===p.studentId; })[0];
    out.push({type:"participation", label:"Mitarbeit – "+(st?st.name:"?")});
  });
  return out;
}

/* ---------- Konflikte ---------- */
function addConflict(kind, id, label, mine, theirs){
  var cid = kind+":"+id;
  if(state.conflicts.some(function(c){ return c.id===cid; })) return;
  state.conflicts.push({ id:cid, kind:kind, label:label, mine:mine, theirs:theirs });
}
function describeItem(i){
  return (i.published?"freigegeben":"nicht freigegeben") + (i.isCurrent?", aktueller Schritt":"");
}
function describePart(p){
  var s = STATUS.filter(function(x){ return x.id===p.status; })[0];
  return (s?s.label:"–") + (p.grade?" · Note "+p.grade:"") + (p.note?" · Notiz":"");
}
function resolveConflict(cid, take){
  var c = state.conflicts.filter(function(x){ return x.id===cid; })[0];
  if(!c) return;
  var rest = c.id.substring(c.kind.length+1);

  if(c.kind==="item"){
    var it = state.local.items.filter(function(x){ return x.id===parseInt(rest,10); })[0];
    if(it){
      if(take==="mine"){ it.updatedAt = now(); it.syncedAt = c.serverUpdatedAt || it.syncedAt; it.dirty = true; }
      else { it.published=c.serverData.published; it.isCurrent=c.serverData.isCurrent;
             it.updatedAt=c.serverData.updatedAt; it.syncedAt=c.serverData.updatedAt; it.dirty=false; }
    }
  } else if(c.kind==="participation"){
    var p = state.local.participation[rest];
    if(p){
      if(take==="mine"){ p.updatedAt = now(); p.syncedAt = c.serverUpdatedAt || p.syncedAt; p.dirty = true; }
      else { p.status=c.serverData.status; p.grade=c.serverData.grade; p.note=c.serverData.note;
             p.updatedAt=c.serverData.updatedAt; p.syncedAt=c.serverData.updatedAt; p.dirty=false; }
    }
  } else if(c.kind==="orphan"){
    if(take==="theirs"){                       // verwaisten Eintrag verwerfen
      if(state.local.participation[rest]) delete state.local.participation[rest];
    }
  }
  state.conflicts = state.conflicts.filter(function(x){ return x.id!==cid; });
  save(); render();
}

function pullDemo(){
  var added=0, updated=0, conflicts=0;

  state.server.items.forEach(function(srv){
    var loc = state.local.items.filter(function(x){ return x.id===srv.id; })[0];
    if(!loc){ state.local.items.push(clone(srv)); added++; return; }
    ["title","description","teacherNote","sortOrder"].forEach(function(f){ loc[f]=srv[f]; });
    var srvNewer = loc.syncedAt && newer(srv.updatedAt, loc.syncedAt);
    if(isDirty(loc) && srvNewer){
      addConflict("item", loc.id, "Ablauf · "+loc.title, describeItem(loc), describeItem(srv));
      var c = state.conflicts[state.conflicts.length-1];
      c.serverData = { published:srv.published, isCurrent:srv.isCurrent, updatedAt:srv.updatedAt };
      c.serverUpdatedAt = srv.updatedAt;
      conflicts++; return;
    }
    if(!isDirty(loc)){
      loc.published=srv.published; loc.isCurrent=srv.isCurrent;
      loc.updatedAt=srv.updatedAt; loc.syncedAt=srv.updatedAt; loc.dirty=false; updated++;
    }
  });

  Object.keys(state.server.participation).forEach(function(k){
    var srv = state.server.participation[k], loc = state.local.participation[k];
    if(!loc){ state.local.participation[k]=clone(srv); state.local.participation[k].syncedAt=srv.updatedAt; added++; return; }
    var srvNewer = loc.syncedAt && newer(srv.updatedAt, loc.syncedAt);
    if(isDirty(loc) && srvNewer){
      addConflict("participation", k, conflictName(loc), describePart(loc), describePart(srv));
      var c2 = state.conflicts[state.conflicts.length-1];
      c2.serverData = { status:srv.status, grade:srv.grade, note:srv.note, updatedAt:srv.updatedAt };
      c2.serverUpdatedAt = srv.updatedAt;
      conflicts++; return;
    }
    if(!isDirty(loc)){
      loc.status=srv.status; loc.grade=srv.grade; loc.note=srv.note;
      loc.updatedAt=srv.updatedAt; loc.syncedAt=srv.updatedAt; loc.dirty=false; updated++;
    }
  });

  state.lastSync = now(); save();
  return { added:added, updated:updated, conflicts:conflicts };
}

function pushDemo(){

/* ----- Live: echte Nextcloud ----- */
function apiAvailable(){ return !!(window.spo && window.spo.api); }

function api(method, path, payload){
  if(!apiAvailable()) return Promise.reject(new Error("Die Verbindung gibt es nur in der Desktop-App."));
  return window.spo.api({
    method: method, path: path,
    query: method==="GET" ? (payload||{}) : null,
    body:  method==="POST" ? (payload||{}) : null
  }).then(function(r){
    if(!r || !r.ok) throw new Error((r && r.error) || "Unbekannter Fehler");
    return r.data;
  });
}

function pullLive(){
  return api("GET", "/sync", {}).then(function(data){
    if(!data || data.apiVersion !== API_VERSION){
      throw new Error("Die Nextcloud-App spricht eine andere Fassung der Schnittstelle ("
        + (data && data.apiVersion) + " statt " + API_VERSION + ").");
    }

    var courses=[], students=[], lessons=[], serverItems=[], added=0, updated=0, conflicts=0;

    (data.courses||[]).forEach(function(c){
      courses.push({ id:c.id, name:c.name, participationScale:c.participationScale||"" });
      (c.students||[]).forEach(function(s){
        students.push({ id:s.id, courseId:c.id, name:s.name, note:s.note||"" });
      });
      (c.lessons||[]).forEach(function(l){
        lessons.push({ id:l.id, courseId:c.id, lessonDate:l.lessonDate, lessonSlot:l.lessonSlot,
                       title:l.title, goal:l.goal||"", description:l.description||"", updatedAt:l.updatedAt||"" });
        (l.items||[]).forEach(function(i){ i.lessonId = l.id; serverItems.push(i); });
      });
    });

    state.meta.courses = courses;
    state.meta.students = students;
    state.local.lessons = lessons;

    /* Elemente zusammenfuehren: Inhalte kommen immer vom Server, die
       Zustaende nur, wenn lokal nichts Offenes vorliegt. */
    var merged = [];
    serverItems.forEach(function(srv){
      var loc = state.local.items.filter(function(x){ return x.id===srv.id; })[0];
      if(!loc){
        merged.push({ id:srv.id, lessonId:srv.lessonId, sortOrder:srv.sortOrder||0,
          title:srv.title, description:srv.description||"", teacherNote:srv.teacherNote||"",
          published:!!srv.published, isCurrent:!!srv.isCurrent,
          updatedAt:srv.updatedAt||"", syncedAt:srv.updatedAt||"", dirty:false });
        added++; return;
      }
      loc.lessonId=srv.lessonId; loc.sortOrder=srv.sortOrder||0; loc.title=srv.title;
      loc.description=srv.description||""; loc.teacherNote=srv.teacherNote||"";

      var srvNewer = loc.syncedAt && newer(srv.updatedAt, loc.syncedAt);
      if(isDirty(loc) && srvNewer){
        addConflict("item", loc.id, "Ablauf · "+loc.title, describeItem(loc), describeItem(srv));
        var c = state.conflicts[state.conflicts.length-1];
        c.serverData = { published:!!srv.published, isCurrent:!!srv.isCurrent, updatedAt:srv.updatedAt };
        c.serverUpdatedAt = srv.updatedAt;
        conflicts++;
      } else if(!isDirty(loc)){
        loc.published=!!srv.published; loc.isCurrent=!!srv.isCurrent;
        loc.updatedAt=srv.updatedAt||""; loc.syncedAt=srv.updatedAt||""; loc.dirty=false; updated++;
      }
      merged.push(loc);
    });
    /* Lokal offene Elemente, die es serverseitig nicht mehr gibt, nicht
       stillschweigend wegwerfen. */
    state.local.items.filter(isDirty).forEach(function(loc){
      if(!merged.some(function(m){ return m.id===loc.id; })) merged.push(loc);
    });
    state.local.items = merged;

    var byKey = {};
    (data.participation||[]).forEach(function(srv){
      var k = pkey(srv.lessonId, srv.studentId);
      byKey[k] = srv;
      var loc = state.local.participation[k];
      if(!loc){
        state.local.participation[k] = { lessonId:srv.lessonId, studentId:srv.studentId,
          status:srv.status||"", grade:srv.grade||"", note:srv.note||"",
          updatedAt:srv.updatedAt||"", syncedAt:srv.updatedAt||"", dirty:false };
        added++; return;
      }
      var pNewer = loc.syncedAt && newer(srv.updatedAt, loc.syncedAt);
      if(isDirty(loc) && pNewer){
        addConflict("participation", k, conflictName(loc), describePart(loc), describePart(srv));
        var c2 = state.conflicts[state.conflicts.length-1];
        c2.serverData = { status:srv.status||"", grade:srv.grade||"", note:srv.note||"", updatedAt:srv.updatedAt };
        c2.serverUpdatedAt = srv.updatedAt;
        conflicts++;
      } else if(!isDirty(loc)){
        loc.status=srv.status||""; loc.grade=srv.grade||""; loc.note=srv.note||"";
        loc.updatedAt=srv.updatedAt||""; loc.syncedAt=srv.updatedAt||""; loc.dirty=false; updated++;
      }
    });
    Object.keys(state.local.participation).forEach(function(k){
      if(!byKey[k] && !isDirty(state.local.participation[k])) delete state.local.participation[k];
    });

    state.lastSync = now(); state.mode = "live"; save();
    return { added:added, updated:updated, conflicts:conflicts };
  });
}

function pushLive(){
  var items = dirtyItems().map(function(i){
    return { id:i.id, published:!!i.published, isCurrent:!!i.isCurrent, updatedAt:i.updatedAt };
  });
  var parts = dirtyParticipation().map(function(p){
    return { lessonId:p.lessonId, studentId:p.studentId, status:p.status||"",
             grade:p.grade||"", note:p.note||"", updatedAt:p.updatedAt };
  });
  if(!items.length && !parts.length) return Promise.resolve({ sent:0, conflicts:0 });

  return api("POST", "/state", { items:items, participation:parts }).then(function(res){
    var sent=0, conflicts=0;

    (res.items||[]).forEach(function(r){
      var loc = state.local.items.filter(function(x){ return x.id===r.id; })[0];
      if(!loc) return;
      if(r.result==="applied"){ loc.syncedAt=r.updatedAt||loc.updatedAt; loc.dirty=false; sent++; }
      else if(r.result==="skipped" && r.server){
        addConflict("item", loc.id, "Ablauf · "+loc.title, describeItem(loc), describeItem(r.server));
        var c = state.conflicts[state.conflicts.length-1];
        c.serverData = { published:!!r.server.published, isCurrent:!!r.server.isCurrent, updatedAt:r.server.updatedAt };
        c.serverUpdatedAt = r.server.updatedAt;
        conflicts++;
      } else if(r.result==="unknown"){
        addConflict("orphan", loc.id, "Ablauf · "+loc.title,
          "Liegt nur auf diesem Gerät", "In der Nextcloud nicht mehr vorhanden");
        conflicts++;
      }
    });

    (res.participation||[]).forEach(function(r){
      var k = pkey(r.lessonId, r.studentId);
      var loc = state.local.participation[k];
      if(!loc) return;
      if(r.result==="applied"){ loc.syncedAt=r.updatedAt||loc.updatedAt; loc.dirty=false; sent++; }
      else if(r.result==="skipped" && r.server){
        addConflict("participation", k, conflictName(loc), describePart(loc), describePart(r.server));
        var c2 = state.conflicts[state.conflicts.length-1];
        c2.serverData = { status:r.server.status||"", grade:r.server.grade||"", note:r.server.note||"", updatedAt:r.server.updatedAt };
        c2.serverUpdatedAt = r.server.updatedAt;
        conflicts++;
      } else if(r.result==="unknown"){
        addConflict("orphan", k, conflictName(loc),
          "Liegt nur auf diesem Gerät", "Stunde oder Person nicht mehr vorhanden");
        conflicts++;
      }
    });

    state.lastSync = now(); save();
    return { sent:sent, conflicts:conflicts };
  });
}

/* Reihenfolge: erst senden, dann holen. Sonst ueberschreibt ein Abruf
   eigene Aenderungen, die der Server noch gar nicht kennt. */
function doSync(){
  if(ui.busy) return;
  ui.busy = true; render();

  var live = state.conn.connected && apiAvailable();
  var run = live
    ? pushLive().then(function(p){ return pullLive().then(function(q){ return {p:p,q:q}; }); })
    : Promise.resolve({ p:pushDemo(), q:pullDemo() });

  run.then(function(r){
    var msg = (r.p.sent||0)+" übertragen, "+((r.q.added||0)+(r.q.updated||0))+" geladen";
    var conf = (r.p.conflicts||0)+(r.q.conflicts||0);
    toast(conf ? conf+" Konflikt(e) – bitte entscheiden" : msg);
  }).catch(function(err){
    toast(err && err.message ? err.message : "Abgleich fehlgeschlagen");
  }).then(function(){
    ui.busy = false; render();
  });
}

function loadConnection(){
  if(!(window.spo && window.spo.creds)) return Promise.resolve();
  return window.spo.creds.load().then(function(c){
    if(c && c.baseUrl && c.user && c.hasPassword){
      state.conn = { baseUrl:c.baseUrl, user:c.user, connected:true };
      state.mode = "live";
      save(); render();
    }
  }).catch(function(){});
}

function testConnection(draft){
  if(!(window.spo && window.spo.creds)){ toast("Nur in der Desktop-App möglich."); return; }
  ui.busy = true; render();

  window.spo.creds.save(draft)
    .then(function(){ return api("GET", "/info", {}); })
    .then(function(info){
      if(!info || info.apiVersion !== API_VERSION){
        throw new Error("Diese Nextcloud-App ist zu alt – bitte auf School Planner 1.3.0 aktualisieren.");
      }
      state.conn = { baseUrl:draft.baseUrl, user:info.user||draft.user, connected:true };

function disconnect(){
  if(window.spo && window.spo.creds) window.spo.creds.clear();
  state.conn = { baseUrl:state.conn.baseUrl, user:state.conn.user, connected:false };
  state.mode = "demo";
  save(); render();
  toast("Verbindung getrennt. Erfasste Daten bleiben auf diesem Gerät.");
}

/* =========================================================================
   Aktionen im Unterricht
   Geschrieben wird ausschliesslich an den Elementen: published und isCurrent.
   ========================================================================= */
function startLesson(id){
  var its = itemsOf(id);
  if(!its.length) return;
  its.forEach(function(i){ if(i.isCurrent){ i.isCurrent=false; touchItem(i); } });
  its[0].isCurrent = true; touchItem(its[0]);
  render();
}
function nextStep(id){
  var its = itemsOf(id);
  var idx = its.findIndex(function(i){ return i.isCurrent; });
  if(idx < 0){ startLesson(id); return; }
  var cur = its[idx];
  cur.isCurrent = false;
  if(!cur.published) cur.published = true;
  touchItem(cur);
  if(idx < its.length-1){ its[idx+1].isCurrent = true; touchItem(its[idx+1]); }
  render();
}
function prevStep(id){
  var its = itemsOf(id);
  var idx = its.findIndex(function(i){ return i.isCurrent; });
  if(idx < 0){ idx = its.length; }            // nach Stundenende zurueckspringen
  if(idx <= 0) return;
  if(its[idx]){ its[idx].isCurrent=false; touchItem(its[idx]); }
  its[idx-1].isCurrent = true; touchItem(its[idx-1]);
  render();
}
function jumpTo(lessonId, itemId){
  itemsOf(lessonId).forEach(function(i){
    var want = i.id===itemId;
    if(i.isCurrent !== want){ i.isCurrent = want; touchItem(i); }
  });
  render();
}
function togglePublish(itemId){
  var it = state.local.items.filter(function(i){ return i.id===itemId; })[0];
  if(!it) return;
  it.published = !it.published; touchItem(it); render();
}

function toast(msg){
  ui.toast = msg;
  if(ui.toastTimer) clearTimeout(ui.toastTimer);
  ui.toastTimer = setTimeout(function(){ ui.toast=null; render(); }, 2800);
  render();
}

var UPDATE_REPO = "holger-dev/schoolplanneroffline";
var UPDATE_SKIP_KEY = "spo.skipVersion";

function isNewer(remote, local){
  var a=String(remote).split("."), b=String(local).split(".");
  for(var i=0;i<Math.max(a.length,b.length);i++){
    var x=parseInt(a[i]||"0",10)||0, y=parseInt(b[i]||"0",10)||0;
    if(x!==y) return x>y;
  }
  return false;
}
function checkForUpdate(){
  if(!window.spo || !window.spo.version) return;
  var skipped=""; try{ skipped = localStorage.getItem(UPDATE_SKIP_KEY)||""; }catch(e){}
  fetch("https://api.github.com/repos/"+UPDATE_REPO+"/releases/latest",
        { headers:{ "Accept":"application/vnd.github+json" } })
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(rel){
      if(!rel || !rel.tag_name) return;
      var latest = String(rel.tag_name).replace(/^v/,"");
      if(latest===skipped || !isNewer(latest, window.spo.version)) return;
      ui.update = { version:latest, url: rel.html_url || ("https://github.com/"+UPDATE_REPO+"/releases/latest") };
      render();
    })
    .catch(function(){});
}

  if(!ui.update) return "";

  var steps = mac

      + '<li><b>App beenden.</b></li>'

      + '<li>Beim ersten Start: <b>Rechtsklick auf die App → Öffnen</b>, dann noch einmal Öffnen. '
      + 'Die Meldung kommt, weil die App nicht signiert ist.</li>'
    : '<li><b>Herunterladen</b> – Installationsdatei vom Release.</li>'
      + '<li><b>App beenden.</b></li>'
      + '<li>Installation ausführen und die vorhandene Fassung ersetzen.</li>';
  return '<div class="update">'
    + '<div class="between"><h3>Version '+esc(ui.update.version)+' ist verfügbar</h3>'
    + '<span class="small muted">installiert: '+esc(window.spo.version)+'</span></div>'

    + 'Vor dem Wechsel am besten einmal abgleichen.</p>'

    + '<div class="controls"><button class="btn btn--primary" data-relopen="1">Zur Download-Seite</button>'
    + '<button class="btn btn--ghost" data-relskip="1">Diese Version überspringen</button></div></div>';

/* =========================================================================
   Ansichten
   ========================================================================= */
function lessonProgress(l){
  var its = itemsOf(l.id);
  if(!its.length) return 0;
  var st = lessonStatus(l);
  if(st==="done") return 1;
  var idx = its.findIndex(function(i){ return i.isCurrent; });
  if(idx>=0) return idx/its.length;
  return its.filter(function(i){ return i.published; }).length / its.length;
}
function partStats(l){
  var studs = studentsOf(l.courseId), scale = scaleOf(l.courseId);
  var graded=0, absent=0, marked=0;
  studs.forEach(function(s){
    var p = part(l.id, s.id);
    if(!p) return;
    if(p.grade) graded++;
    if(p.status) marked++;
    if(p.status==="excused" || p.status==="unexcused") absent++;
  });
  return { total:studs.length, graded:graded, absent:absent, marked:marked,
           scale:scale, grading:gradesFor(scale).length>0 };
}
function statusBadge(l){
  var s = lessonStatus(l);
  if(s==="running") return '<span class="badge badge--running">läuft</span>';
  if(s==="done") return '<span class="badge badge--done">fertig</span>';
  return '<span class="badge badge--planned">geplant</span>';
}
function lessonCard(l){
  var c = course(l.courseId) || {name:""}, st = partStats(l), prog = Math.round(lessonProgress(l)*100);
  return '<button class="lesson '+(lessonStatus(l)==="running"?"lesson--running":"")+'" data-open="'+l.id+'">'
    + '<div class="lesson__top"><div class="slot">'+l.lessonSlot+'<small>Std</small></div>'
    + '<div style="min-width:0;flex:1"><div class="lesson__course">'+esc(c.name)+'</div>'
    + '<div class="lesson__title">'+esc(l.title)+'</div></div>'+statusBadge(l)+'</div>'
    + '<div class="bar"><i style="width:'+prog+'%"></i></div>'
    + '<div class="lesson__meta"><span>'+itemsOf(l.id).length+' Schritte</span>'
    + '<span>·</span><span>'+(st.grading ? "Bewertet "+st.graded : "Erfasst "+st.marked)+'/'+st.total+'</span>'
    + (st.absent ? '<span>·</span><span style="color:var(--bad)">'+st.absent+' fehlen</span>':'')
    + '</div></button>';
}

  var its = itemsOf(l.id), status = lessonStatus(l), s = stageData(l);

  var head = '<div class="card"><div class="between"><div>'
    + '<div class="lesson__course">'+esc(c.name)+' · '+deShort(l.lessonDate)+' · '+l.lessonSlot+'. Stunde</div>'
    + '<h2 style="margin-top:3px;font-size:1.1rem">'+esc(l.title)+'</h2></div>'+statusBadge(l)+'</div>'
    + (l.goal ? '<p class="small muted" style="margin-top:8px;line-height:1.55">'+esc(l.goal)+'</p>' : '')
    + '</div>';

  var tabs = '<div class="row" style="margin:12px 0 10px;gap:6px">'
    + '<button class="btn '+(ui.tab==="flow"?"btn--primary":"")+'" data-tab="flow">Ablauf</button>'
    + '<button class="btn '+(ui.tab==="part"?"btn--primary":"")+'" data-tab="part">Mitarbeit</button></div>';

  var body;
  if(ui.tab==="flow"){
    var cockpit = "";
    if(status!=="planned"){
      var stage = '<div class="panel panel--stage">'
        + '<div class="panel__label"><span class="dot"></span>Für die Klasse'
        + (s.item ? ' · Schritt '+s.step+' von '+s.total : '')+'</div>'
        + '<div class="stage__title">'+(s.item ? esc(s.item.title) : "Das war die Stunde")+'</div>'
        + (s.item ? (s.item.description ? fmt(s.item.description) : '<p class="fmt">Kein Text hinterlegt.</p>') : '')
        + '</div>';
      var notes = '<div class="panel panel--notes"><div class="panel__label">Nur für dich</div>'
        + (s.item && s.item.teacherNote
            ? '<div class="teacher-note">'+esc(s.item.teacherNote)+'</div>'
            : '<p class="small muted">Für diesen Schritt ist kein Hinweis hinterlegt.</p>')
        + (s.next
            ? '<div class="next"><b>Als Nächstes</b>'+esc(s.next.title)
              + (s.next.teacherNote ? '<div class="teacher-note">'+esc(s.next.teacherNote)+'</div>' : '')+'</div>'
            : '<div class="next"><b>Als Nächstes</b>'+(s.item?"Letzter Schritt der Stunde":"Stunde beendet")+'</div>')
        + '</div>';
      cockpit = '<div class="cockpit">'+stage+notes+'</div>';
    }

    var nav1, project="";
    if(status==="planned"){
      nav1 = '<button class="btn btn--primary" data-start="'+l.id+'">Stunde starten</button>';
    } else if(!s.item){
      nav1 = '<button class="btn" data-prev="'+l.id+'">Zurück</button>'
        + '<button class="btn btn--primary" data-tab="part">Mitarbeit prüfen</button>';
    } else {
      var last = s.step>=s.total;
      nav1 = '<button class="btn" data-prev="'+l.id+'"'+(s.step<=1?" disabled":"")+'>Zurück</button>'
        + '<button class="btn btn--primary" data-next="'+l.id+'">'+(last?"Stunde abschließen":"Weiter")+'</button>'
        + '<span class="small muted" style="margin-left:4px">Schritt '+s.step+' von '+s.total+' · ← → oder Leertaste</span>';
    }
    if(status!=="planned"){
      project = '<span class="spacer"></span>'
        + '<button class="btn btn--ghost" data-present="1" title="Zweites Fenster für den Beamer">'
        + (presenterOpen()?"Präsentation schließen":"Präsentationsfenster")+'</button>'
        + '<button class="btn btn--ghost" data-fs="1" title="Vollbild auf diesem Bildschirm">Vollbild</button>';
    }

    var steps = '<div class="section-title">Ablauf</div>' + its.map(function(i,n){
      var cls = i.isCurrent ? "step--current" : i.published ? "step--done" : "";
      return '<div class="step '+cls+'" data-jump="'+i.id+'">'
        + '<div class="step__num">'+(n+1)+'</div><div class="step__body">'
        + '<div class="between"><div class="step__title">'+esc(i.title)+'</div>'
        + '<button class="badge '+(i.published?"badge--done":"badge--planned")+'" data-pub="'+i.id+'">'
        + (i.published?"freigegeben":"intern")+'</button></div>'
        + (i.teacherNote ? '<div class="note"><b>Nur für dich</b>'+esc(i.teacherNote)+'</div>' : '')
        + '</div></div>';
    }).join("");

    body = cockpit + '<div class="controls">'+nav1+project+'</div>' + steps;
  } else {
    var scale = c.participationScale||"", marks = gradesFor(scale), grading = marks.length>0;
    var rows = studentsOf(c.id).map(function(st2){
      var p = part(l.id, st2.id) || {};
      var away = p.status==="excused" || p.status==="unexcused";
      var statusBtns = STATUS.map(function(s3){
        return '<button class="'+s3.cls+'" aria-pressed="'+(p.status===s3.id)+'" title="'+s3.label+'"'
          + ' data-status="'+st2.id+'|'+s3.id+'">'+s3.short+'</button>';
      }).join("");
      var gradeCell;
      if(!grading){ gradeCell = '<span class="no-scale">ohne Bewertung</span>'; }
      else if(away){ gradeCell = '<span class="no-scale">–</span>'; }
      else if(scale==="note"){
        gradeCell = '<select class="grade-select" data-gradesel="'+st2.id+'">'
          + '<option value=""'+(p.grade?"":" selected")+'>–</option>'
          + marks.map(function(g){ return '<option value="'+g+'"'+(p.grade===g?" selected":"")+'>'+g+'</option>'; }).join("")
          + '</select>';
      } else {
        gradeCell = '<div class="seg">'+marks.map(function(g){
          return '<button aria-pressed="'+(p.grade===g)+'" data-grade="'+st2.id+'|'+g+'">'+esc(g)+'</button>';
        }).join("")+'</div>';
      }
      return '<div class="student"><div class="student__name"><span>'+esc(st2.name)+'</span>'
        + (isDirty(p)? '<span class="badge badge--dirty">offen</span>':'')+'</div>'
        + '<div class="seg seg--status">'+statusBtns+'</div><div>'+gradeCell+'</div>'
        + '<button class="student__note '+(p.note?"has":"")+'" data-note="'+st2.id+'" title="Notiz bearbeiten">'
        + (p.note? esc(p.note) : "Notiz …")+'</button></div>';
    }).join("");

    var stt = partStats(l);
    var label = stt.grading ? '<b>'+stt.graded+' von '+stt.total+'</b> bewertet'
                            : '<b>'+stt.marked+' von '+stt.total+'</b> erfasst';
    var value = stt.total ? Math.round((stt.grading?stt.graded:stt.marked)/stt.total*100) : 0;
    body = '<div class="card" style="margin-bottom:var(--gap)"><div class="between">'
      + '<div class="small">'+label+'</div>'
      + '<div class="small muted">'+SCALE_LABEL[scale]+' · '+stt.absent+' abwesend</div></div>'
      + '<div class="bar"><i style="width:'+value+'%"></i></div></div>'
      + '<div class="students">'+rows+'</div>';
  }
  return head + tabs + body;
}

function viewSync(){
  var pend = pendingChanges();
  var live = state.conn.connected;

  /* --- Verbindung --- */
  var conn;
  if(!apiAvailable()){
    conn = '<div class="card"><div class="between"><b class="small">Verbindung</b>'
      + '<span class="badge badge--planned">Demo</span></div>'
      + '<p class="small muted" style="margin-top:7px;line-height:1.55">'
      + 'Im Browser gibt es keine Verbindung zur Nextcloud – das verhindert der '
      + 'Sicherheitsmechanismus für seitenübergreifende Anfragen. In der Desktop-App '
      + 'laufen die Anfragen im Hintergrundprozess und funktionieren. Hier läuft alles '
      + 'gegen einen simulierten Server, damit sich der Ablauf trotzdem durchspielen lässt.</p></div>';
  } else if(live && !ui.connDraft){
    conn = '<div class="card"><div class="between"><b class="small">Verbunden</b>'
      + '<span class="badge badge--done">Nextcloud</span></div>'
      + '<div class="kv"><span class="muted">Adresse</span><b>'+esc(state.conn.baseUrl)+'</b></div>'
      + '<div class="kv"><span class="muted">Benutzer</span><b>'+esc(state.conn.user)+'</b></div>'
      + '<div class="controls"><button class="btn btn--ghost" data-connedit="1">Ändern</button>'
      + '<button class="btn btn--danger" data-disconnect="1">Trennen</button></div></div>';
  } else {
    var d = ui.connDraft || { baseUrl:state.conn.baseUrl||"", user:state.conn.user||"", password:"" };
    conn = '<div class="card"><div class="between"><b class="small">Mit der Nextcloud verbinden</b>'
      + '<span class="badge badge--planned">Demo</span></div>'
      + '<p class="small muted" style="margin-top:7px;line-height:1.55">Benötigt School Planner '
      + '<b>1.3.0</b> in der Nextcloud und ein <b>App-Passwort</b>: dort unter '
      + '<i>Einstellungen → Sicherheit → Geräte &amp; Sitzungen</i> einen Namen eintragen und '
      + '<i>Neues App-Passwort erstellen</i>. Das Passwort wird nur einmal angezeigt.</p>'
      + '<div class="stack" style="margin-top:10px">'
      + '<input id="connUrl" class="field" style="width:100%" placeholder="https://cloud.example.org" value="'+esc(d.baseUrl)+'">'
      + '<input id="connUser" class="field" style="width:100%" placeholder="Benutzername" value="'+esc(d.user)+'">'
      + '<input id="connPass" class="field" style="width:100%" type="password" placeholder="App-Passwort" value="'+esc(d.password)+'">'
      + '</div>'
      + '<p class="small muted" style="margin-top:8px">Das App-Passwort wird verschlüsselt im '
      + 'Schlüsselbund abgelegt und verlässt dieses Gerät nur Richtung deiner Nextcloud.</p>'
      + '<div class="controls"><button class="btn btn--primary" data-conntest="1"'+(ui.busy?" disabled":"")+'>'
      + (ui.busy?"Prüfe …":"Verbindung testen")+'</button>'
      + (state.conn.baseUrl ? '<button class="btn btn--ghost" data-conncancel="1">Abbrechen</button>' : '')
      + '</div></div>';
  }

  var html = '<div class="section-title">Verbindung</div>'+conn
    + '<div class="section-title">Abgleich</div><div class="card">'
    + '<div class="kv"><span class="muted">Letzter Abgleich</span><b>'+relTime(state.lastSync)+'</b></div>'
    + '<div class="kv"><span class="muted">Offene Änderungen</span><b style="color:'+(pend.length?"var(--warn)":"var(--ok)")+'">'+pend.length+'</b></div>'
    + '<div class="kv"><span class="muted">Konflikte</span><b style="color:'+(state.conflicts.length?"var(--bad)":"var(--ok)")+'">'+state.conflicts.length+'</b></div>'
    + '<div class="controls"><button class="btn btn--primary" data-sync="1"'+(ui.busy?" disabled":"")+'>'
    + (ui.busy?"Läuft …":(live?"Jetzt abgleichen":"Abgleich simulieren"))+'</button>'
    + '<span class="small muted">Erst senden, dann holen.</span></div></div>';

  if(state.conflicts.length){
    html += '<div class="section-title">Konflikte – bitte entscheiden</div>'
      + state.conflicts.map(function(c){
          var orphan = c.kind==="orphan";
          return '<div class="conflict"><b>'+esc(c.label)+'</b>'
            + '<p class="small muted" style="margin-top:5px">'
            + (orphan ? 'Der Eintrag existiert in der Nextcloud nicht mehr.'
                      : 'Auf beiden Seiten geändert. Welche Fassung gilt?')+'</p>'
            + '<div class="choice">'
            + '<button data-keep="'+c.id+'|mine"><small>Dieses Gerät</small><strong>'+esc(c.mine)+'</strong></button>'
            + '<button data-keep="'+c.id+'|theirs"><small>'+(orphan?"Verwerfen":"Nextcloud")+'</small><strong>'+esc(c.theirs)+'</strong></button>'
            + '</div></div>';
        }).join("");
  }

  html += '<div class="section-title">Noch nicht übertragen</div><div class="card">'
    + (pend.length
        ? pend.map(function(p){ return '<div class="change"><span class="dot"></span><span>'+esc(p.label)+'</span></div>'; }).join("")
        : '<p class="small muted">Alles übertragen. Du kannst offline weiterarbeiten.</p>')
    + '</div>';

  if(!live){
    html += '<div class="section-title">Demo-Werkzeuge</div><div class="card">'
      + '<p class="small muted" style="line-height:1.55">Simuliert, dass jemand parallel in der '
      + 'Nextcloud gearbeitet hat – so lässt sich die Konfliktbehandlung ausprobieren.</p>'
      + '<div class="controls"><button class="btn" data-simulate="1">Änderung simulieren</button>'
      + '<button class="btn btn--danger" data-reset="1">Demodaten zurücksetzen</button></div></div>';
  }
  return html;
}

/* ---------- Rahmen ---------- */
function topbar(){
  var title, sub, back="";
  if(ui.view==="lesson"){
    var l = lesson(ui.lessonId);
    back = '<button class="back" data-back="1">‹</button>';
    title = "Stunde"; sub = l ? deShort(l.lessonDate)+" · "+l.lessonSlot+". Stunde" : "";
  } else if(ui.view==="courses"){ title="Kurse"; sub=state.meta.courses.length+" Kurse"; }
  else if(ui.view==="sync"){ title="Abgleich"; sub=(state.conn.connected?"verbunden · ":"Demo · ")+"zuletzt "+relTime(state.lastSync); }
  else { title="Heute"; sub=deLong(iso(new Date())); }

  var themeBtn = '<button class="icon-btn" data-theme="1" title="Erscheinungsbild: '
    + ({system:"System",light:"Hell",dark:"Dunkel"}[themePref])+'">'
    + '<svg viewBox="0 0 24 24">'+THEME_ICON[themePref]+'</svg></button>';

  return '<div class="topbar">'+back
    + '<div><div class="topbar__title">'+title+'</div><div class="topbar__sub">'+sub+'</div></div>'
    + '<div class="topbar__spacer"></div>'+nav()+themeBtn+'</div>';
}

function nav(){
  var pend = pendingChanges().length + state.conflicts.length;
  function b(id,label,path){
    return '<button data-go="'+id+'" aria-current="'+(ui.view===id||(id==="today"&&ui.view==="lesson"))+'">'
      + '<svg viewBox="0 0 24 24">'+path+'</svg><span>'+label+'</span>'
      + (id==="sync"&&pend ? '<span class="count">'+pend+'</span>':'')+'</button>';
  }
  return '<div class="nav">'
    + b("today","Heute",'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 11h18"/>')
    + b("courses","Kurse",'<path d="M4 5h16v14H4z"/><path d="M4 9h16M9 9v10"/>')
    + b("sync","Abgleich",'<path d="M21 12a9 9 0 0 1-15.5 6.2M3 12A9 9 0 0 1 18.5 5.8"/><path d="M3 20v-5h5M21 4v5h-5"/>')
    + '</div>';
}

function sheet(){
  if(!ui.sheet) return "";
  var st = state.meta.students.filter(function(x){ return x.id===ui.sheet.studentId; })[0] || {name:"?"};
  var p = part(ui.sheet.lessonId, ui.sheet.studentId) || {};
  return '<div class="sheet-bg" data-sheetbg="1"><div class="sheet">'
    + '<h3>Notiz zu '+esc(st.name)+'</h3>'
    + '<p class="small muted" style="margin-top:3px">Nur für dich sichtbar, wird mit der Mitarbeit übertragen.</p>'
    + '<textarea id="noteInput" placeholder="z. B. hat die Gruppe gut moderiert">'+esc(p.note||"")+'</textarea>'
    + '<div class="controls"><button class="btn btn--primary" data-savenote="1">Speichern</button>'
    + '<button class="btn" data-sheetbg="1">Abbrechen</button></div></div></div>';
}

function overlay(){
  if(!ui.fullscreen || ui.view!=="lesson") return "";
  var l = lesson(ui.lessonId); if(!l) return "";
  var s = stageData(l), last = s.item && s.step>=s.total;
  return '<div class="overlay">'
    + '<div class="overlay__meta">'+esc(s.courseName)+' · '+esc(s.lessonTitle)+'</div>'
    + '<h1 class="overlay__title">'+(s.item?esc(s.item.title):"Das war die Stunde")+'</h1>'
    + '<div class="overlay__body">'+(s.item?fmt(s.item.description):"")+'</div>'
    + '<div class="presbar"><button class="btn" data-prev="'+l.id+'">Zurück</button>'
    + '<div class="grow"><div class="bar"><i style="width:'+(s.item?Math.round(s.step/s.total*100):100)+'%"></i></div>'
    + '<div class="small muted" style="margin-top:5px">'+(s.item?"Schritt "+s.step+" von "+s.total:"abgeschlossen")+'</div></div>'
    + (s.item ? '<button class="btn btn--primary" data-next="'+l.id+'">'+(last?"Abschließen":"Weiter")+'</button>' : '')
    + '<button class="btn btn--ghost" data-fsexit="1">Beenden</button></div></div>';
}

function render(){
  var body = ui.view==="today" ? viewToday()
    : ui.view==="courses" ? viewCourses()
    : ui.view==="sync" ? viewSync()
    : viewLesson();

  document.getElementById("app").innerHTML =
    '<div class="titlebar"></div><div class="app">'+topbar()+updateBanner()+body+'</div>'
    + sheet()+overlay()+(ui.toast ? '<div class="toast">'+esc(ui.toast)+'</div>' : '');

  var ta = document.getElementById("noteInput");
  if(ta){ ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
  if(ui.searchFocus){
    var sf = document.getElementById("courseSearch");
    if(sf){ sf.focus(); try{ sf.setSelectionRange(sf.value.length, sf.value.length); }catch(e){} }
    ui.searchFocus = false;
  }
  updatePresenter();
}

/* =========================================================================
   Ereignisse
   ========================================================================= */
function connDraftFromDom(){
  var g = function(id){ var e=document.getElementById(id); return e ? e.value : ""; };
  return { baseUrl:g("connUrl").trim(), user:g("connUser").trim(), password:g("connPass") };
}

document.addEventListener("click", function(ev){
  if(!ev.target || !ev.target.closest) return;
  var el = ev.target.closest("[data-go],[data-open],[data-back],[data-tab],[data-start],[data-next],"
    + "[data-prev],[data-jump],[data-pub],[data-status],[data-grade],[data-note],[data-savenote],"
    + "[data-sheetbg],[data-sync],[data-keep],[data-simulate],[data-reset],[data-present],[data-fs],"
    + "[data-fsexit],[data-theme],[data-course],[data-cfilter],[data-relopen],[data-relskip],"
    + "[data-conntest],[data-connedit],[data-conncancel],[data-disconnect]");
  if(!el) return;
  var d = el.dataset;

  if(d.savenote){
    var ta = document.getElementById("noteInput");
    setPart(ui.sheet.lessonId, ui.sheet.studentId, { note: ta ? ta.value.trim() : "" });
    ui.sheet=null; render(); return;
  }
  if(d.sheetbg){ if(ev.target===el || el.classList.contains("btn")){ ui.sheet=null; render(); } return; }

  if(d.relopen){
    if(window.spo && window.spo.openExternal) window.spo.openExternal(ui.update.url);
    else window.open(ui.update.url, "_blank");
    return;
  }
  if(d.relskip){
    try{ localStorage.setItem(UPDATE_SKIP_KEY, ui.update.version); }catch(e){}
    ui.update=null; render(); return;
  }

  if(d.conntest){ testConnection(connDraftFromDom()); return; }
  if(d.connedit){ ui.connDraft = { baseUrl:state.conn.baseUrl, user:state.conn.user, password:"" }; render(); return; }
  if(d.conncancel){ ui.connDraft = null; render(); return; }
  if(d.disconnect){ disconnect(); return; }

  if(d.theme){ cycleTheme(); return; }
  if(d.go){ ui.view=d.go; window.scrollTo(0,0); render(); return; }
  if(d.back){ ui.view="today"; render(); return; }
  if(d.open){ ui.view="lesson"; ui.lessonId=parseInt(d.open,10); ui.tab="flow"; window.scrollTo(0,0); render(); return; }
  if(d.tab){ ui.tab=d.tab; render(); return; }
  if(d.course){ ui.courseId=parseInt(d.course,10); ui.courseSearch=""; render(); return; }
  if(d.cfilter){ ui.courseFilter=d.cfilter; render(); return; }

  if(d.start){ startLesson(parseInt(d.start,10)); return; }
  if(d.next){ nextStep(parseInt(d.next,10)); return; }
  if(d.prev){ prevStep(parseInt(d.prev,10)); return; }
  if(d.pub){ ev.stopPropagation(); togglePublish(parseInt(d.pub,10)); return; }
  if(d.jump){ jumpTo(ui.lessonId, parseInt(d.jump,10)); return; }

  if(d.status){
    var a = d.status.split("|"), sid = parseInt(a[0],10);
    var cur = part(ui.lessonId, sid);
    setPart(ui.lessonId, sid, { status: (cur && cur.status===a[1]) ? "" : a[1] });
    render(); return;
  }
  if(d.grade){
    var b = d.grade.split("|"), sid2 = parseInt(b[0],10);
    var cur2 = part(ui.lessonId, sid2);
    setPart(ui.lessonId, sid2, {
      grade: (cur2 && cur2.grade===b[1]) ? "" : b[1],
      status: (cur2 && cur2.status) ? cur2.status : "present"
    });
    render(); return;
  }
  if(d.note){ ui.sheet = { lessonId:ui.lessonId, studentId:parseInt(d.note,10) }; render(); return; }

  if(d.present){ if(presenterOpen()) closePresenter(); else openPresenter(); render(); return; }
  if(d.fs){ enterFullscreen(); return; }
  if(d.fsexit){ exitFullscreen(); return; }

  if(d.sync){ doSync(); return; }
  if(d.keep){ var k=d.keep.split("|"); resolveConflict(k[0], k[1]); return; }
  if(d.simulate){ toast(simulateServerEdit()); return; }
  if(d.reset){
    if(confirm("Alle lokalen Daten verwerfen und die Demo neu aufsetzen?")){
      var conn = state.conn;
      state = freshState(); state.conn = conn; save();
      ui.view="today"; toast("Demodaten zurückgesetzt");
    }
    return;
  }
});

/* Suche in der Kursansicht – Fokus und Schreibmarke ueberleben das Neuzeichnen. */
document.addEventListener("input", function(ev){
  if(!ev.target) return;
  if(ev.target.id==="courseSearch"){
    ui.courseSearch = ev.target.value; ui.searchFocus = true; render(); return;
  }
  if(ev.target.id==="connUrl" || ev.target.id==="connUser" || ev.target.id==="connPass"){
    ui.connDraft = connDraftFromDom();     // ohne Neuzeichnen: Eingabe bleibt stehen
  }
});

/* Notenauswahl 1–6 */
document.addEventListener("change", function(ev){
  var el = ev.target;
  if(!el || !el.dataset || !el.dataset.gradesel) return;
  var sid = parseInt(el.dataset.gradesel, 10);
  var cur = part(ui.lessonId, sid);
  setPart(ui.lessonId, sid, { grade: el.value, status: (cur && cur.status) ? cur.status : "present" });
  render();
});

/* Tastatur – auch fuer Presenter-Fernbedienungen, die Pfeiltasten senden. */
document.addEventListener("keydown", function(ev){
  if(ui.sheet) return;
  var tag = ev.target && ev.target.tagName;
  if(tag==="TEXTAREA" || tag==="INPUT" || tag==="SELECT") return;
  if(ui.view!=="lesson" || ui.tab!=="flow") return;
  var l = lesson(ui.lessonId);
  if(!l || lessonStatus(l)==="planned") return;

  if(ev.key==="ArrowRight" || ev.key==="PageDown" || ev.key===" "){ ev.preventDefault(); nextStep(l.id); }
  else if(ev.key==="ArrowLeft" || ev.key==="PageUp"){ ev.preventDefault(); prevStep(l.id); }
  else if(ev.key==="Escape" && ui.fullscreen){ exitFullscreen(); }
});
document.addEventListener("fullscreenchange", function(){
  if(!document.fullscreenElement && ui.fullscreen){ ui.fullscreen=false; render(); }
});

/* ---------- Start ---------- */
initTheme();
if(window.spo && window.spo.platform==="darwin"){ document.body.classList.add("is-mac-app"); }
state = load();
save();
render();
loadConnection();
checkForUpdate();

</script>
</body>
</html>
