name: Build and publish desktop apps

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS (dmg)
            script: "dist:mac"
          - os: windows-latest
            label: Windows (exe)
            script: "dist:win"
          - os: ubuntu-latest
            label: Linux (AppImage)
            script: "dist:linux"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Version aus dem Release-Tag uebernehmen (v1.2.3 -> 1.2.3), damit
      # package.json und Release nicht auseinanderlaufen.
      - name: Sync version with tag
        if: github.event_name == 'release'
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          node -e "
            const fs=require('fs');
            const p=JSON.parse(fs.readFileSync('package.json','utf8'));
            p.version='$TAG';
            fs.writeFileSync('package.json', JSON.stringify(p,null,2)+'\n');
            console.log('Version gesetzt auf', p.version);
          "

      # Wichtig: das "--" trennt die Argumente fuer npm von denen fuer
      # electron-builder. Ohne die Trennung landet "--publish never" bei npm,
      # und electron-builder bekommt ein unbekanntes Argument "never".
      - name: Build
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS bleibt unsigniert: ohne Apple-Zertifikat wuerde der Schritt
          # sonst mit einem Signaturfehler abbrechen.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            npm run ${{ matrix.script }} -- --publish always
          else
            npm run ${{ matrix.script }} -- --publish never
          fi

      - name: Show build output
        if: always()
        shell: bash
        run: ls -la dist || true

      - name: Upload artifacts (bei manuellem Lauf)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
          if-no-files-found: warn
