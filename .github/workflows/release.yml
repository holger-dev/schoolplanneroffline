name: Build and publish desktop apps

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag eines bestehenden Releases (z. B. v0.2.0). Leer = nur bauen, nichts anhängen."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS (dmg)
            script: "dist:mac"
          - os: windows-latest
            label: Windows (exe)
            script: "dist:win"
          - os: ubuntu-latest
            label: Linux (AppImage)
            script: "dist:linux"

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Bei manuellem Lauf mit Tag genau diesen Stand bauen.
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Version aus dem Tag uebernehmen (v1.2.3 -> 1.2.3), damit package.json
      # und Release nicht auseinanderlaufen. electron-builder sucht das
      # passende Release ueber genau diese Versionsnummer.
      - name: Sync version with tag
        if: github.event_name == 'release' || github.event.inputs.tag != ''
        shell: bash
        env:
          RAW_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          VERSION="${RAW_TAG#v}"
          node -e "
            const fs=require('fs');
            const p=JSON.parse(fs.readFileSync('package.json','utf8'));
            p.version=process.argv[1];
            fs.writeFileSync('package.json', JSON.stringify(p,null,2)+'\n');
            console.log('Version gesetzt auf', p.version);
          " "$VERSION"

      # Wichtig: das "--" trennt die Argumente fuer npm von denen fuer
      # electron-builder. Ohne die Trennung landet "--publish never" bei npm,
      # und electron-builder bekommt ein unbekanntes Argument "never".
      - name: Build
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS bleibt unsigniert: ohne Apple-Zertifikat wuerde der Schritt
          # sonst mit einem Signaturfehler abbrechen.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          if [ "${{ github.event_name }}" = "release" ] || [ -n "${{ github.event.inputs.tag }}" ]; then
            npm run ${{ matrix.script }} -- --publish always
          else
            npm run ${{ matrix.script }} -- --publish never
          fi

      - name: Show build output
        if: always()
        shell: bash
        run: ls -la dist || true

      # Ein Lauf, der gruen meldet aber nichts gebaut hat, waere schlimmer als
      # ein roter – deshalb hier bewusst hart abbrechen.
      - name: Verify artifacts
        shell: bash
        run: |
          # nullglob statt ls: GitHub faehrt bash mit "set -eo pipefail", und
          # ein ls ohne Treffer wuerde den Schritt beenden, bevor er prueft.
          shopt -s nullglob
          files=(dist/*.dmg dist/*.exe dist/*.AppImage)
          echo "Gefundene Pakete: ${#files[@]}"
          for f in "${files[@]}"; do echo "  - $f"; done
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::Es wurde kein Installationspaket erzeugt."
            exit 1
          fi

      - name: Upload artifacts (bei manuellem Lauf)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
          if-no-files-found: warn
